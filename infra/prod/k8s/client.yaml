# A pod deploy.sh and validate.sh run curl in: the registry and the Services
# answer a pod of the namespace, not necessarily the machine a script runs on.
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels:
    app.kubernetes.io/name: client
spec:
  restartPolicy: Never
  # A script that was stopped cannot remove it; this ends it, and the next run
  # replaces what is left.
  activeDeadlineSeconds: 3600
  # `sleep` is the pod's first process and does not hear that it should stop:
  # without this, removing the pod waits half a minute for it.
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  enableServiceLinks: false
  # Any unprivileged user: it runs curl and keeps nothing.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
      command: [sleep, "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
