# A rootless BuildKit that deploy.sh starts for the one build of a commit and
# removes again. The build runs in this namespace, out of its quota; its cache
# goes with the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: builder
  labels:
    app.kubernetes.io/name: builder
data:
  # The cluster's registry answers over plain HTTP.
  buildkitd.toml: |
    [registry."${REGISTRY}"]
      http = true
---
apiVersion: v1
kind: Pod
metadata:
  name: builder
  labels:
    app.kubernetes.io/name: builder
spec:
  restartPolicy: Never
  # Two build attempts and the streaming of the context; a stopped deploy
  # cannot remove the pod, this does.
  activeDeadlineSeconds: 5400
  automountServiceAccountToken: false
  enableServiceLinks: false
  containers:
    - name: buildkitd
      image: moby/buildkit:v0.34.1-rootless@sha256:f68752a5a94acfcdad2d07867b7075601a421638e17fc5f28efc1c814d0c4f89
      args:
        - --addr
        - unix:///run/user/1000/buildkit/buildkitd.sock
        - --oci-worker-no-process-sandbox
      readinessProbe:
        exec:
          command: [buildctl, debug, workers]
        periodSeconds: 2
      # The web app's build alone asks Node for 8 GiB (the Dockerfile), beside
      # the server's build in parallel. The quota counts the request only.
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          memory: 16Gi
      # `baseline` refuses the unconfined seccomp and AppArmor profiles
      # BuildKit documents for rootless; it builds with them unset.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      volumeMounts:
        - name: state
          mountPath: /home/user/.local/share/buildkit
        - name: config
          mountPath: /home/user/.config/buildkit
  volumes:
    - name: state
      emptyDir: {}
    - name: config
      configMap:
        name: builder
